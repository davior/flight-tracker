<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Chemtrail Tracker">
  <defs>
    <linearGradient id="ct-sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2484c3"></stop>
      <stop offset="100%" stop-color="#155485"></stop>
    </linearGradient>
    <linearGradient id="ct-trail" x1="0" y1="1" x2="1" y2="0">
