services:
  db:
    image: mariadb:11
    container_name: ft-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: flightlogs
      MYSQL_USER: flightuser
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mariadb-admin ping -h 127.0.0.1 -uflightuser --silent"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build: ./backend
    container_name: ft-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
    volumes:
      - uploads_data:/app/uploads
    networks:
      - default
      - web
    depends_on:
      db:
        condition: service_healthy

  web-static:
    image: nginx:alpine
    container_name: ft-web-static
    restart: unless-stopped
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx-web.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - web

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    container_name: ft-frontend
    restart: unless-stopped
    networks:
      - web
    depends_on:
      - backend

networks:
  default:
  web:
    external: true

volumes:
  db_data:
  uploads_data:
