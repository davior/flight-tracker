services:
  db:
    image: mariadb:11
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: flightlogs
      MYSQL_USER: flightuser
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mariadb-admin ping -h 127.0.0.1 -uflightuser --silent"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build: ./backend
    restart: always
    env_file: .env
    environment:
      DB_HOST: db
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  caddy:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    container_name: mailserver
    hostname: mail
    domainname: chemtrail-tracker.com
    restart: always
    ports:
      - "25:25"
      - "587:587"
      - "993:993"
    volumes:
      - ./mailserver/data:/var/mail
      - ./mailserver/state:/var/mail-state
      - ./mailserver/config:/tmp/docker-mailserver
      - ./mailserver/logs:/var/log/mail
      - caddy_data:/data:ro
    environment:
      OVERRIDE_HOSTNAME: mail.chemtrail-tracker.com
      DOMAINNAME: chemtrail-tracker.com
      ONE_DIR: "1"
      DMS_DEBUG: "0"
      ENABLE_SPAMASSASSIN: "0"
      ENABLE_CLAMAV: "0"
      ENABLE_FAIL2BAN: "0"
      PERMIT_DOCKER: "network"
      SSL_TYPE: manual
      SSL_CERT_PATH: /data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/mail.chemtrail-tracker.com/mail.chemtrail-tracker.com.crt
      SSL_KEY_PATH: /data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/mail.chemtrail-tracker.com/mail.chemtrail-tracker.com.key
    cap_add:
      - NET_ADMIN
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
    healthcheck:
      test: ["CMD-SHELL", "ss -lntp | grep ':587'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      - caddy

volumes:
  db_data:
  uploads_data:
  caddy_data:
  caddy_config:
